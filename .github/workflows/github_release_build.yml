name: GitHub Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create the release under (e.g. v0.8.1-vaj)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      # One line per edition branch; see "Editions" in README.md.
      EDITION_NOTES: 'Termux:Boot for the VAJ edition of Termux Launcher (io.vaj.tl.boot). A release build signed with the shared testkey, so it installs beside the io.vaj.tl launcher builds published from PickleHik3/termux-launcher.'
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and release
        shell: bash
        run: |
          set -e
          # The release build type: not debuggable, signed with the shared test key (app/build.gradle).
          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="${RELEASE_TAG}+github.release"

          export TERMUX_BOOT_APP_BUILD__APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          ./gradlew assembleRelease

          # The APK basename carries the edition, so take it from the build rather than repeat it.
          APK_PATH="$(ls "$APK_DIR_PATH"/*.apk)"
          test -f "$APK_PATH"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT2"
          if "$AAPT2" dump badging "$APK_PATH" | grep -q application-debuggable; then
            echo "Built APK is debuggable: $APK_PATH" >&2
            exit 1
          fi
          (cd "$APK_DIR_PATH"; sha256sum "$(basename "$APK_PATH")" > checksums-sha256.txt)
          cat "$APK_DIR_PATH/checksums-sha256.txt"

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$EDITION_NOTES" \
            "$APK_PATH" \
            "$APK_DIR_PATH/checksums-sha256.txt"
